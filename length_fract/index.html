<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
   <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no, maximum-scale=1"/>
    <title>length in fract met kleuren palet en extra fract</title>
    <script type="text/javascript" src="../lib/GlslCanvas.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      .glslCanvas {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh; /* tracks the visible viewport on mobile */
  }
    </style>
  </head>
<body>
<canvas
 class="glslCanvas"
  data-fullscreen="true"
 data-fragment="
 #ifdef GL_ES
  precision mediump float;
#endif
  float pi = 3.14159265359;
  uniform vec2 u_resolution;
  uniform float u_time;

  vec3 palette(float t) {
  vec3 a = vec3(0.5, 0.5, 0.5);
  vec3 b = vec3(0.5, 0.5, 0.5);
  vec3 c = vec3(1.0, 1.0, 1.0);
  vec3 d = vec3(0.263, 0.416, 0.557);
  return a + b*tan(2.*pi*(c*t+d));
}

void main(){
  // vec2 st  = (gl_FragCoord.xy * 2.0 - u_resolution.xy)/u_resolution.y;
    vec2 uv = (gl_FragCoord.xy * 2.0 - u_resolution.xy)/u_resolution.y;
   vec2 st = fract(uv)-0.5;    
   float d1 = length(abs(st)-0.25)   -  length(abs(st)-0.344);
   float d2 = length(abs(st)-0.6)    /  length(abs(st)-0.8);
   vec3 col = palette(d1*sin(u_time  / 5.512)*8.);
   float pct    = fract(d2*sin(u_time / 5.512)*8.);
   gl_FragColor = pct+vec4(col,1.0);}
   "
  ></canvas>
  </body>
</html>
