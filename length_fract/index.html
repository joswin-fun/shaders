 
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
   <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no, maximum-scale=1"/>
    <title>shader met length en fract</title>
    <script type="text/javascript" src="../lib/GlslCanvas.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      .glslCanvas {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh; /* tracks the visible viewport on mobile */
  }
    </style>
  </head>
<body>
<canvas
 class="glslCanvas"
  data-fullscreen="true"
 data-fragment="#ifdef GL_ES
precision mediump float;
#endif

uniform vec2 u_resolution;
uniform float u_time;

void main(){
	 vec2 ua = (gl_FragCoord.xy * 2.0 - u_resolution.xy)/u_resolution.y;
   vec2 st = fract(ua*1.)-0.5;
   float d = length(abs(st)-0.252) / length(abs(st)-0.344);
	 float pct = fract(d*sin(u_time/5.)*8.);
   gl_FragColor = pct+vec4(vec3(abs(sin(u_time/2.)*2.),0.3,abs(cos(u_time/2.000))),1.0);
}
"
  ></canvas>
  </body>
</html>
