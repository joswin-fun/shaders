<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
   <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no, maximum-scale=1"/>
    <title>polar systeem met cirkels 2</title>
    <script type="text/javascript" src="../lib/GlslCanvas.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      .glslCanvas {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh; /* tracks the visible viewport on mobile */
  }
    </style>
  </head>
<body>
<canvas
 class="glslCanvas"
  data-fullscreen="true"
 data-fragment="
#ifdef GL_ES 
precision mediump float; 
#endif 
uniform vec2 u_resolution; 
float pi = 3.14159265359; 
uniform float u_time; 
 
// de sdf functie voor een cirkel 
float sdCircle(vec2 p, float r) {return length(p) -r;} 
 
//st_inGrid functie plaatst de pixelcoordinaten st in een grid 
vec2 st_inGrid(vec2 st, float gridSize){ 
   vec2 st_grid = fract (st * gridSize); 
   return st_grid; 
} 
//st_toPolar functie plaatst de pixelcoordinaten st in een polar assenstelsel 
vec2 st_toPolar(vec2 st, float time) { 
   float d = length(st); 
   float angle = atan(st.y, st.x); 
   vec2 st_polar = vec2(0.25 / d-time * 0.25, angle / pi); 
   return st_polar; 
} 
 
void main() { 
//vec2 st zijn de pixelcoordinaten st in een [-1,+1] Cartesian assenstelsel 
    vec2 st = (gl_FragCoord.xy * 2.0 - u_resolution.xy)/u_resolution.x; 
//vec2 st_polar zijn de pixelcoordinaten st in een [-1,+1] polar assenstelsel 
    vec2 st_polar = st_toPolar(st, -u_time); 
    //van het polar coord stelsel wordt een 8x8 grid gemaakt 
    vec2 st_polarGrid = st_inGrid(st_polar,4.0); 
//De sdf cirkels in het polar grid stoppen 
    float d = sdCircle(st_polarGrid-0.5,0.5); 
    vec3 col = d <= 0.0 ? vec3(0.9,0.6,0.3): vec3(1.0,0.0,0.0); 
 
//Dit is het fun deel van de code 
      col = col * (1.20 -exp(-4.0 * abs(d))); 
  //  col = col * 0.8 + col * 0.2 * sin(50.0 * d); 
  //  col = col * 0.8 + col * 4.0 * sin(20.0 * abs(d) -2.0 * u_time);
  //  col = col * 0.8 + col * 1.0 * sin(50.0 * abs(d) -2.0 * u_time); 
 
   gl_FragColor = vec4(col, 1.0); 
}
"
  ></canvas>
  </body>
</html>
